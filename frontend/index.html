<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Product Browser</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="layout">
    <aside class="sidebar">
      <h2>Filters</h2>
      <section>
        <h3>Category</h3>
        <div id="categoryList"></div>
      </section>
      <section>
        <h3>Price Range</h3>
        <div class="range-wrap">
          <div class="track"></div>
          <div class="range-fill" id="fill"></div>
          <input type="range" id="minRange">
          <input type="range" id="maxRange">
        </div>
        <div class="price-labels"><span id="minLabel"></span><span id="maxLabel"></span></div>
      </section>
      <section>
        <h3>Minimum Rating</h3>
        <div id="ratingList"></div>
      </section>
      <button id="resetSide" class="btn-light">Reset filters</button>
    </aside>

    <main class="content">
      <div class="toolbar">
        <span id="resultCount"></span>
        <select id="sortSelect">
          <option value="default">Sort By: Featured</option>
          <option value="price_asc">Price: Low to High</option>
          <option value="price_desc">Price: High to Low</option>
          <option value="rating_desc">Top Rated First</option>
        </select>
      </div>
      <div id="grid" class="grid"></div>
      <div id="empty" class="empty hidden">
        <p>No items match your criteria.</p>
        <button id="resetEmpty" class="btn">Reset filters</button>
      </div>
    </main>
  </div>
  <script src="script.js"></script>
</body>
</html>
